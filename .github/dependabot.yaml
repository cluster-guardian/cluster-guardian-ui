version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per concern keeps the review surface small: a react bump and an
      # eslint bump have nothing to say to each other.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'react-router']
      tooling:
        patterns:
          ['vite', 'vitest', '@vitejs/*', 'typescript', 'typescript-eslint', 'eslint*', 'prettier']
      testing:
        patterns: ['@playwright/test', '@testing-library/*', 'jsdom']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
