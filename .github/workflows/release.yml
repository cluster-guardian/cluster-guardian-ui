name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for cosign's keyless signing via GitHub OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/cluster-guardian/cluster-guardian-ui
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM and provenance attestations ride on the manifest, matching how
          # the backend publishes its image.
          sbom: true
          provenance: mode=max

      - uses: sigstore/cosign-installer@v3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Sign by digest, once — the tags all point at the same manifest.
          cosign sign --yes "ghcr.io/cluster-guardian/cluster-guardian-ui@${DIGEST}"

  bundle:
    name: Attach the static bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Package
        run: |
          tar -czf "cluster-guardian-ui_${GITHUB_REF_NAME}_dist.tar.gz" -C dist .
          sha256sum "cluster-guardian-ui_${GITHUB_REF_NAME}_dist.tar.gz" > checksums.txt

      # The tarball is for anyone serving the SPA from their own web server or
      # CDN instead of running the image.
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            cluster-guardian-ui_*_dist.tar.gz
            checksums.txt
          generate_release_notes: true
