# Deploys the UI alongside an existing cluster-guardian in the same namespace.
# Hardened to pass cluster-guardian's own checks — this is the tool's dashboard,
# so it should not show up in its own report.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-guardian-ui
  labels:
    app.kubernetes.io/name: cluster-guardian-ui
    app.kubernetes.io/part-of: cluster-guardian
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-guardian-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-guardian-ui
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # the nginx user baked into nginx-unprivileged
        # fsGroup is what makes the emptyDirs below writable: the kubelet chowns
        # them to this group. Without it nginx cannot render its config and the
        # container never starts.
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: ghcr.io/cluster-guardian/cluster-guardian-ui:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CG_UPSTREAM
              value: http://cluster-guardian:8080
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # The only two paths nginx-unprivileged writes to: /tmp for its pid
          # and proxy temp files, and /etc/nginx/conf.d where the entrypoint
          # renders the config template at start.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: conf, mountPath: /etc/nginx/conf.d }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          readinessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: { path: /index.html, port: http }
            initialDelaySeconds: 5
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: conf, emptyDir: {} }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cluster-guardian-ui
---
apiVersion: v1
kind: Service
metadata:
  name: cluster-guardian-ui
  labels:
    app.kubernetes.io/name: cluster-guardian-ui
spec:
  selector:
    app.kubernetes.io/name: cluster-guardian-ui
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cluster-guardian-ui
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-guardian-ui
---
# Ingress traffic from anywhere in the cluster, egress only to the backend and
# to DNS. The UI has no reason to reach anything else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cluster-guardian-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cluster-guardian-ui
  policyTypes: [Ingress, Egress]
  ingress:
    - ports:
        - port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cluster-guardian
      ports:
        - port: 8080
    - ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
